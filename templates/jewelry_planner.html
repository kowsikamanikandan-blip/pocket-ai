{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section><h1>Jewelry Budget Planner</h1><form class="card form" id="jewelryForm" enctype="multipart/form-data"><label>Budget ₹<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding" required></label><label>Style<select name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Statement</option></select></label><label>Outfit color<input name="outfit_color"></label><label>Description<textarea name="description"></textarea></label><label>Optional outfit image<input name="outfit_image" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn primary">Generate plan</button><p id="formMessage"></p></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script>bindJewelryPlanner()</script>{% endblock %}
